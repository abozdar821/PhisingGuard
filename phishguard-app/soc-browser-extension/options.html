<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>SOC Browser Monitor — Settings</title>
<style>
:root{--bg:#f4f6fa;--card:#fff;--text:#0f172a;--muted:#55627a;--line:#d6dce6;--accent:#0f766e;--bad:#be123c;--ok:#047857;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#0b1020;--card:#121a2e;--text:#e5ebf6;--muted:#9aa8c4;--line:#2a3756;--accent:#2dd4bf;--bad:#fda4af;--ok:#6ee7b7;color-scheme:dark}}
*{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--text);font:15px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif;padding:40px 20px}
main{max-width:560px;margin:0 auto} h1{font-size:22px;margin:0 0 4px} p{color:var(--muted);margin:0 0 20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:20px}
label{display:block;font-weight:600;font-size:13px;margin:0 0 6px} .field{margin-bottom:16px}
input[type=text],input[type=password]{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--text);font:13px ui-monospace,Menlo,Consolas,monospace}
.check{display:flex;gap:10px;align-items:flex-start;margin-bottom:12px;font-weight:400} .check input{margin-top:4px}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
button{font:600 14px system-ui,sans-serif;padding:10px 16px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--text);cursor:pointer}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
#msg{margin-top:14px;font-size:14px;min-height:1.5em} #msg.ok{color:var(--ok)} #msg.bad{color:var(--bad)}
small{color:var(--muted);display:block;margin-top:6px}
</style></head>
<body><main>
<h1>SOC Browser Monitor</h1>
<p>Connects this browser to your SOC Threat Dashboard. Copy both values from the dashboard's “My browser” tab.</p>
<div class="card">
  <form id="f">
    <div class="field"><label for="endpoint">Dashboard address</label><input id="endpoint" type="text" spellcheck="false" placeholder="http://127.0.0.1:5000"></div>
    <div class="field"><label for="token">Browser token</label><input id="token" type="password" spellcheck="false" autocomplete="off">
      <small>Shown on the dashboard, and printed when the dashboard starts.</small></div>
    <label class="check"><input id="enabled" type="checkbox"> <span>Send my browser's requests to the dashboard</span></label>
    <label class="check"><input id="enforceBlocklist" type="checkbox"> <span>Block the sites I block on the dashboard</span></label>
    <div class="row"><button class="primary" type="submit">Save</button><button type="button" id="test">Test connection</button></div>
    <div id="msg" role="status"></div>
  </form>
</div>
</main><script src="options.js"></script></body></html>
